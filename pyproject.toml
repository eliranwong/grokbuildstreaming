[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grokbuildstreaming"
version = "0.1.3"
description = "Stream text from the signed-in Grok Build CLI"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Eliran Wong" }]

[tool.setuptools]
packages = ["grokbuildstreaming"]

[tool.setuptools.package-dir]
grokbuildstreaming = "."
